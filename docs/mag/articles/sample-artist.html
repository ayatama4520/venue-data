:root {
  --ink: #050409;
  --ink-raised: #121018;
  --hairline: rgba(255,255,255,0.1);
  --lime: #d5ff3f;
  --text: #f5f3ed;
  --text-dim: #a8a6ac;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  line-height: 1.75;
}
.display { font-family: "Space Grotesk", -apple-system, sans-serif; }
a { color: var(--lime); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 clamp(20px, 6vw, 40px); }

header.site {
  border-bottom: 1px solid var(--hairline);
  padding: 22px clamp(20px, 6vw, 40px);
  display: flex;
  align-items: baseline;
  gap: 10px;
}
header.site .logo { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em; }
header.site .logo span { color: var(--lime); }
header.site .magtag {
  font-size: 0.7rem;
  letter-spacing: 0.16em;
  color: var(--ink);
  background: var(--lime);
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 700;
}
header.site nav { margin-left: auto; font-size: 0.85rem; color: var(--text-dim); }

.hero-mag { padding: clamp(40px, 8vw, 72px) 0 clamp(24px, 5vw, 40px); }
.hero-mag h1 { font-size: clamp(2rem, 6vw, 2.8rem); margin: 0 0 10px; }
.hero-mag h1 .accent { color: var(--lime); }
.hero-mag p { color: var(--text-dim); max-width: 520px; margin: 0; }

.grid { display: flex; flex-direction: column; gap: 0; padding-bottom: 60px; }
.card {
  display: block;
  padding: 26px 0;
  border-top: 1px solid var(--hairline);
}
.card:hover { text-decoration: none; }
.card .tag {
  display: inline-block;
  font-size: 0.72rem;
  color: var(--lime);
  border: 1px solid rgba(213,255,63,0.35);
  border-radius: 999px;
  padding: 2px 10px;
  margin-bottom: 10px;
  letter-spacing: 0.04em;
}
.card h2 {
  font-size: 1.3rem;
  margin: 0 0 8px;
  color: var(--text);
}
.card:hover h2 { color: var(--lime); }
.card .excerpt { color: var(--text-dim); font-size: 0.92rem; margin: 0 0 8px; }
.card .meta { color: var(--text-dim); font-size: 0.78rem; }

article.post { padding: clamp(30px, 6vw, 50px) 0 80px; }
article.post .tag {
  display: inline-block;
  font-size: 0.72rem;
  color: var(--lime);
  border: 1px solid rgba(213,255,63,0.35);
